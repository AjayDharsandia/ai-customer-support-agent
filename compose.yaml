services:
  server:
    build:
      context: ./server
      target: runtime
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      AUTH_COOKIE_MODE: localhost
      PORT: "5000"
      # Normal application containers must never select the integration database.
      MONGODB_TEST_URI: ""
    ports:
      - "127.0.0.1:5000:5000"
    stop_grace_period: 10s
    security_opt:
      - no-new-privileges:true

  client:
    build:
      context: ./client
      target: runtime
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/backend}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      server:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
